name: Récupérer ma clé MDBList

on:
  workflow_dispatch:

permissions: {}

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier la présence de la clé
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          if [ -z "$MDBLIST_API_KEY" ]; then
            echo "Le secret MDBLIST_API_KEY est absent ou vide."
            exit 1
          fi

      - name: Envoyer la clé par mail
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Ma clé API MDBList"
          to: legay.romain@gmail.com
          from: 'MDBList <${{ secrets.SMTP_USERNAME }}>'
          body: |
            Voici la clé API MDBList enregistrée dans ton dépôt GitHub :

            ${{ secrets.MDBLIST_API_KEY }}
          nodemailerlog: false
          nodemailerdebug: false
