name: Récupérer ma clé MDBList

on:
  workflow_dispatch:

permissions: {}

jobs:
  envoyer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Envoyer la clé par Gmail
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          import sys
          from email.message import EmailMessage

          required = [
              "MDBLIST_API_KEY",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
          ]

          for name in required:
              if not os.environ.get(name, "").strip():
                  print(f"Secret absent ou vide : {name}")
                  sys.exit(1)

          message = EmailMessage()
          message["Subject"] = "Ma clé API MDBList"
          message["From"] = os.environ["SMTP_USERNAME"]
          message["To"] = "legay.romain@gmail.com"
          message.set_content(
              "Voici ta clé API MDBList :\n\n"
              + os.environ["MDBLIST_API_KEY"]
              + "\n"
          )

          try:
              with smtplib.SMTP_SSL(
                  "smtp.gmail.com",
                  465,
                  context=ssl.create_default_context(),
                  timeout=30,
              ) as smtp:
                  smtp.login(
                      os.environ["SMTP_USERNAME"],
                      os.environ["SMTP_PASSWORD"],
                  )
                  smtp.send_message(message)

          except smtplib.SMTPAuthenticationError:
              print(
                  "Connexion Gmail refusée : vérifier SMTP_USERNAME "
                  "et le mot de passe d'application SMTP_PASSWORD."
              )
              sys.exit(1)

          except Exception as error:
              print(
                  "Échec de l'envoi : "
                  + type(error).__name__
                  + ". Aucun secret affiché."
              )
              sys.exit(1)

          print("Mail accepté par Gmail. Vérifie ta boîte et les spams.")
          PY
