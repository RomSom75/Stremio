name: Trakt vers MDBList

on:
  schedule:
    - cron: '23 3 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      apply:
        description: 'Appliquer les ajouts dans MDBList (décoché = simulation)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: trakt-mdblist-sync
  cancel-in-progress: false

jobs:
  sync:
    # Set this variable only after a successful manual check.
    if: github.event_name == 'workflow_dispatch' || vars.TRAKT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Vérifier le fonctionnement du script
        run: python3 -m unittest discover -s tests_trakt_mdblist -v
      - name: Synchroniser les visionnages
        env:
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python3 sync_trakt_mdblist.py --apply
          else
            python3 sync_trakt_mdblist.py
          fi
